# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "blup-studio"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Write in Markdown, preview and publish your site"
vendor: "Gabriell Sales"
homepage: "https://github.com/gabriellsalesx/blup"
license: "AGPL-3.0-only"
release: "1"

contents:
  - src: "./bin/blup-studio"
    dst: "/usr/local/bin/blup-studio"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/blup-studio.png"
  - src: "./build/linux/blup-studio.desktop"
    dst: "/usr/share/applications/blup-studio.desktop"

# Dependencies of the GTK4 + WebKitGTK 6.0 stack the Studio is built with
# (Wails 3's default). GStreamer's "good" plugins let the window (and the
# live preview in it) play the posts' MP3 narration: WebKitGTK plays media
# through GStreamer and only lists them as optional.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - gstreamer1.0-plugins-good

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - gstreamer1-plugins-good

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0
      - gst-plugins-good

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

