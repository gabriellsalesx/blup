plugins {
    id 'com.android.application'
}

def blupVersion = (System.getenv("VERSION") ?: "1.0.0").trim()
def blupParts = (blupVersion =~ /^(\d+)\.(\d+)\.(\d+)/)
def blupVersionCode = blupParts.find() ? blupParts.group(1).toInteger() * 10000 + blupParts.group(2).toInteger() * 100 + blupParts.group(3).toInteger() : 1

android {
    namespace = 'com.wails.app'
    compileSdk = 36

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = "io.getblup.notes"
        // Android 8: the reminders use notification channels and exact alarms
        // while idle (ReminderReceiver), which older versions lack.
        minSdk = 26
        targetSdk = 36
        // The release's version (VERSION=x.y.z, set by the builds), so the
        // phone shows the right one; versionCode grows with it (1.0.3 is
        // 10003), so Android takes each release as an update.
        versionCode = blupVersionCode
        versionName = blupVersion

        // Configure supported ABIs
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile = file(keystoreFile)
                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
