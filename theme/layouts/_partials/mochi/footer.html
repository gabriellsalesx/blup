{{- $set := partialCached "site/settings.html" . "site" -}}
<footer class="site-footer">
  <div class="container">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ $set.name }}">{{ partial "mochi/logo.html" . }}</a>
    <div class="footer-row">
      <p class="powered">© {{ now.Year }} {{ $set.name }} · {{ T "poweredBy" }} <a class="made-with" href="https://github.com/gabriellsalesx/blup" rel="noopener"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-github"/></svg>Blup</a></p>
      {{- with $set.social }}
      <ul class="socials">
        {{- range . }}
        <li><a href="{{ .url }}" rel="noopener me" aria-label="{{ .name }}"><svg class="icon"><use href="#i-{{ .icon }}"/></svg></a></li>
        {{- end }}
      </ul>
      {{- end }}
    </div>
    {{- with site.Home.OutputFormats.Get "rss" }}
    <a class="rss" href="{{ .RelPermalink }}"><svg class="icon icon-sm"><use href="#i-rss"/></svg>RSS</a>
    {{- end }}
  </div>
</footer>
