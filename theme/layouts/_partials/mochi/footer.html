<footer class="site-footer">
  <div class="container">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }}">{{ partial "mochi/logo.html" . }}</a>
    <div class="footer-row">
      <p class="powered">© {{ now.Year }} {{ site.Params.author | default site.Title }} · {{ T "poweredBy" }} <a href="https://gohugo.io" rel="noopener">Hugo</a> + <a href="https://obsidian.md" rel="noopener">Obsidian</a></p>
      {{- with site.Params.social }}
      <ul class="socials">
        {{- range . }}
        <li><a href="{{ .url }}" rel="noopener me" aria-label="{{ .name }}"><svg class="icon"><use href="#i-{{ .icon }}"/></svg></a></li>
        {{- end }}
      </ul>
      {{- end }}
    </div>
    {{- with site.Home.OutputFormats.Get "rss" }}
    <a class="rss" href="{{ .RelPermalink }}"><svg class="icon icon-sm"><use href="#i-rss"/></svg>RSS</a>
    {{- end }}
  </div>
</footer>
