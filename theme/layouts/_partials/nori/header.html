{{- $set := partialCached "site/settings.html" . "site" -}}
<header class="nori-header">
  <a class="brand" href="{{ site.Home.RelPermalink }}">{{ partial "mochi/logo.html" . }}<span>{{ $set.name }}</span></a>
  <div class="header-actions">
    <button class="icon-button" type="button" data-search-open aria-label="{{ T "search" }}"><svg class="icon"><use href="#i-search"/></svg></button>
    <div class="theme-picker">
      <button class="icon-button" type="button" popovertarget="theme-menu" aria-label="{{ T "changeTheme" }}" style="anchor-name: --theme">
        <svg class="icon when-light"><use href="#i-sun"/></svg>
        <svg class="icon when-dark"><use href="#i-moon"/></svg>
        <svg class="icon icon-sm"><use href="#i-chevron-down"/></svg>
      </button>
      <div id="theme-menu" class="dropdown" popover style="position-anchor: --theme" role="menu">
        <button type="button" role="menuitemradio" data-set-theme="light"><svg class="icon"><use href="#i-sun"/></svg>{{ T "themeLight" }}</button>
        <button type="button" role="menuitemradio" data-set-theme="dark"><svg class="icon"><use href="#i-moon"/></svg>{{ T "themeDark" }}</button>
        <button type="button" role="menuitemradio" data-set-theme="system"><svg class="icon"><use href="#i-monitor"/></svg>{{ T "themeSystem" }}</button>
      </div>
    </div>
  </div>
</header>
{{ partial "mochi/search.html" . }}
