{{- $label := cond (eq .Data.Plural "authors") (T "authors") (T "tags") -}}
<main id="main" class="nori-main">
  <div class="nori-column">
    {{ partial "nori/head.html" (dict "title" $label) }}
    <ul class="nori-list">
      {{- range .Data.Terms.ByCount }}
      <li><a class="nori-row" href="{{ .Page.RelPermalink }}"><span class="nori-row-top"><span class="nori-row-title"><h2>{{ .Page.LinkTitle }}</h2></span><span class="nori-meta">{{ .Count }}</span></span></a></li>
      {{- end }}
    </ul>
  </div>
</main>
