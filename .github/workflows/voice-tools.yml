# Ferramentas da voz local do Blup Studio (eSpeak NG e LAME), compiladas
# das fontes oficiais por studio/build/voice/build-tools.sh em cada sistema.
# Só gera artefatos desta execução: não cria release nem tag. Para publicar,
# baixe os artefatos (gh run download), confira com
# studio/build/voice/pin-tools.sh e crie a release voice-tools-N à mão.
#
# Disparo manual: Actions > voice-tools > Run workflow, ou
# gh workflow run voice-tools.yml -R gabriellsalesx/blup
name: voice-tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: darwin-arm64
            runner: macos-15
          - name: darwin-amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ferramentas de compilação (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config
      - name: Ferramentas de compilação (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool
      - name: Compilar
        # Pasta curta: o eSpeak NG guarda o caminho dos dados num buffer fixo.
        run: |
          studio/build/voice/build-tools.sh "$RUNNER_TEMP/vt"
          file "$RUNNER_TEMP/vt/bundle/espeak-ng" "$RUNNER_TEMP/vt/bundle/lame"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blup-voice-tools-${{ matrix.name }}
          path: ${{ runner.temp }}/vt/blup-voice-tools-${{ matrix.name }}.tar.gz
          if-no-files-found: error
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Instala a voz local de verdade com o pacote recém-compilado e fala
      # nas três línguas (TestRealInstall, em internal/kokoro).
      - name: Testar a voz com este pacote
        run: BLUP_VOICE_TOOLS_FILE="$RUNNER_TEMP/vt/blup-voice-tools-${{ matrix.name }}.tar.gz" go test -count=1 -run TestRealInstall -v ./internal/kokoro

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runtime do Visual C++ (o ONNX Runtime do Windows precisa dele)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Where-Object { $_.FullName -match '\\MSVC\\\d+\.\d+\.\d+\\' } |
            Sort-Object { [version]($_.FullName -replace '.*\\MSVC\\(\d+\.\d+\.\d+)\\.*', '$1') } |
            Select-Object -Last 1
          if (-not $crt) { throw "Visual C++ runtime not found" }
          Get-ChildItem $crt.FullName -Filter *.dll | ForEach-Object { "$($_.Name) $($_.VersionInfo.FileVersion)" }
          "VCRT_DIR=$($crt.FullName)" >> $env:GITHUB_ENV
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: make curl
          pacboy: gcc:p binutils:p cmake:p ninja:p autotools:p
      - name: Compilar
        shell: msys2 {0}
        run: |
          export VCRT_DIR=$(cygpath -u "$VCRT_DIR")
          work=$(cygpath -u "$RUNNER_TEMP")/vt
          studio/build/voice/build-tools.sh "$work"
          objdump -p "$work/bundle/espeak-ng.exe" | grep 'DLL Name'
          objdump -p "$work/bundle/lame.exe" | grep 'DLL Name'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blup-voice-tools-windows-amd64
          path: ${{ runner.temp }}/vt/blup-voice-tools-windows-amd64.tar.gz
          if-no-files-found: error
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Sem cgo, como o Studio do Windows é compilado.
      - name: Testar a voz com este pacote
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: BLUP_VOICE_TOOLS_FILE="$RUNNER_TEMP/vt/blup-voice-tools-windows-amd64.tar.gz" go test -count=1 -run TestRealInstall -v ./internal/kokoro
