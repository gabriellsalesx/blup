name: release

on:
  push:
    tags: ["v*.*.*"]
  # Rehearsal: every build of the release, with a test version, and nothing
  # published (GoReleaser in snapshot mode, no upload to a release).
  workflow_dispatch:
    inputs:
      version:
        description: "Versão de teste (por exemplo v1.0.0-rc.9)"
        required: true
        default: "v1.0.0-rc.9"

env:
  # The tag that started the run, or the rehearsal's version.
  TAG: ${{ inputs.version || github.ref_name }}
  REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}

# Read only by default: only the jobs that publish to the release write.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Hugo for the tests
        run: |
          # outside the checkout: GoReleaser refuses a dirty working tree
          curl -fsSL -o "$RUNNER_TEMP/hugo.tar.gz" https://github.com/gohugoio/hugo/releases/download/v0.169.0/hugo_0.169.0_linux-amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP" hugo && sudo mv "$RUNNER_TEMP/hugo" /usr/local/bin/
      - run: go test ./...
      # GoReleaser hands no environment variables to the signing command:
      # sign-release reads the key from this file, removed right after.
      - name: Signing key
        env:
          KEY: ${{ secrets.BLUP_RELEASE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::BLUP_RELEASE_KEY is empty"; exit 1; fi
          umask 077 && mkdir -p "$HOME/.config/blup-release"
          printf '%s' "$KEY" > "$HOME/.config/blup-release/release.key"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: ${{ env.REHEARSAL == 'true' && 'release --clean --snapshot --skip=publish' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tag that started this run: other tags on the same commit
          # (voice-tools-N) are not versions.
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
          # DSN do projeto "Blup CLI" no Pulse; sem ela o CLI não manda
          # relatórios de erro (internal/app/reports.go).
          CLI_SENTRY_DSN: ${{ vars.CLI_SENTRY_DSN }}
      - name: Remove the signing key
        if: always()
        run: rm -f "$HOME/.config/blup-release/release.key"

  # Blup Studio for Linux: the binary (for the AUR), AppImage, .deb and
  # .flatpak, built on Ubuntu 24.04 (its glibc 2.39 and GTK 4.14 are the
  # oldest the packages target), then installed and checked on Ubuntu,
  # Debian 13 and Arch before anything is published.
  studio-linux:
    needs: release
    runs-on: ubuntu-24.04
    env:
      DEB_MAINTAINER: ${{ vars.DEB_MAINTAINER || 'Blup <no-reply@getblup.io>' }}
      # DSN do projeto "Blup Studio (desktop)" no Pulse; vai para
      # -X main.studioSentryDSN. Sem ela, o Studio não manda relatórios.
      SENTRY_DSN: ${{ vars.STUDIO_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: studio/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            appstream desktop-file-utils lintian flatpak dbus
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          (cd studio/frontend && npm ci)
      - name: Build and AppImage
        working-directory: studio
        run: wails3 task linux:create:appimage VERSION="${TAG#v}"
      # Wails bundles WebKit with GStreamer but none of its plugins: on Arch
      # and Fedora a post's narration (<audio>) found no sound output and
      # WebKit closed the window. add-gstreamer.sh bundles the plugins from
      # this Ubuntu (the same GStreamer), then they are checked to load with
      # only the AppImage's libraries, here and on Arch.
      - name: Sound in the AppImage (GStreamer plugins)
        working-directory: studio/bin
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio gstreamer1.0-alsa gstreamer1.0-tools
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" ../build/linux/appimage/add-gstreamer.sh \
            blup-studio-x86_64.AppImage "$RUNNER_TEMP/with-sound.AppImage"
          mv "$RUNNER_TEMP/with-sound.AppImage" blup-studio-x86_64.AppImage
          chmod +x blup-studio-x86_64.AppImage
          rm -rf "$RUNNER_TEMP/check" && mkdir -p "$RUNNER_TEMP/check" && cd "$RUNNER_TEMP/check"
          "$OLDPWD/blup-studio-x86_64.AppImage" --appimage-extract >/dev/null
          cp "$(command -v gst-inspect-1.0)" squashfs-root/gst-inspect-1.0
          cat > check.sh <<'CHECK'
          set -e
          lib=/a/usr/lib
          export LD_LIBRARY_PATH="$lib" GST_PLUGIN_SYSTEM_PATH_1_0="$lib/gstreamer-1.0" GST_PLUGIN_PATH_1_0="$lib/gstreamer-1.0" \
            GST_PLUGIN_SCANNER_1_0="$lib/gstreamer-1.0/gst-plugin-scanner" GST_REGISTRY_1_0=/tmp/gst-registry.bin
          for e in autoaudiosink pulsesink playbin uridecodebin appsrc appsink audioconvert audioresample volume mpg123audiodec qtdemux opusdec vorbisdec giostreamsrc deinterleave parsebin typefind queue2; do
            /a/gst-inspect-1.0 "$e" >/dev/null || { echo "GStreamer element missing in the AppImage: $e"; exit 1; }
          done
          echo "GStreamer elements load"
          CHECK
          docker run --rm -v "$PWD/squashfs-root:/a:ro" -v "$PWD/check.sh:/check.sh:ro" ubuntu:24.04 sh /check.sh
          docker run --rm -v "$PWD/squashfs-root:/a:ro" -v "$PWD/check.sh:/check.sh:ro" archlinux:latest sh /check.sh
      - name: Metainfo and desktop file
        working-directory: studio
        run: |
          sed -e "s/@VERSION@/${TAG#v}/" -e "s/@DATE@/$(date -u +%F)/" \
            build/linux/io.getblup.Studio.metainfo.xml > bin/io.getblup.Studio.metainfo.xml
          appstreamcli validate --no-net bin/io.getblup.Studio.metainfo.xml
          desktop-file-validate build/linux/blup-studio.desktop
      - name: .deb
        working-directory: studio
        run: |
          # The package's changelog, with the version being released.
          printf -- '- semver: %s\n  date: %sT00:00:00Z\n  packager: %s\n  changes:\n    - note: Blup Studio %s\n' \
            "${TAG#v}" "$(date -u +%F)" "$DEB_MAINTAINER" "${TAG#v}" > build/linux/nfpm/changelog.yml
          VERSION="${TAG#v}" GOARCH=amd64 wails3 tool package -name blup-studio -format deb \
            -config ./build/linux/nfpm/nfpm.yaml -out "$PWD/bin"
          lintian --fail-on error bin/blup-studio.deb
      - name: Hugo and Pagefind for the direct Flatpak bundle
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/blup-flatpak-tools
        run: go run ./scripts/flatpak-tools -out studio/bin
      - name: .flatpak (GNOME 51 runtime)
        working-directory: studio
        run: |
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive --no-related flathub org.gnome.Platform//51
          build/linux/flatpak/bundle.sh "${TAG#v}" bin/blup-studio.flatpak
          flatpak --user install -y --noninteractive bin/blup-studio.flatpak
          dbus-run-session -- flatpak --user run --command=sh io.getblup.Studio -c 'if ldd /app/bin/blup-studio | grep "not found"; then exit 1; fi'
      - name: Name the files
        working-directory: studio/bin
        run: |
          v="${TAG#v}"
          mkdir -p ../../dist-studio && d=../../dist-studio
          cp ../build/linux/blup-studio.desktop .
          cp ../build/linux/icons/512x512/blup-studio.png .
          cp ../../LICENSE ../../THIRD_PARTY_NOTICES.md ../../README.md .
          tar -czf "$d/blup-studio_${v}_linux_amd64.tar.gz" blup-studio blup-studio.desktop blup-studio.png LICENSE THIRD_PARTY_NOTICES.md README.md
          mv blup-studio-x86_64.AppImage "$d/blup-studio_${v}_x86_64.AppImage"
          mv blup-studio.deb "$d/blup-studio_${v}_amd64.deb"
          mv blup-studio.flatpak "$d/blup-studio_${v}_x86_64.flatpak"
      - name: Installs on Ubuntu 24.04, Debian 13 and Arch
        run: |
          v="${TAG#v}"
          sudo apt-get install -y "./dist-studio/blup-studio_${v}_amd64.deb"
          if ldd /usr/bin/blup-studio | grep "not found"; then exit 1; fi
          docker run --rm -v "$PWD/dist-studio:/d:ro" debian:trixie sh -ec \
            "apt-get update -qq && apt-get install -y -qq /d/blup-studio_${v}_amd64.deb >/dev/null && if ldd /usr/bin/blup-studio | grep 'not found'; then exit 1; fi"
          docker run --rm -v "$PWD/dist-studio:/d:ro" archlinux:latest sh -ec \
            "pacman -Sy --noconfirm --needed gtk4 webkitgtk-6.0 >/dev/null && tar -xzf /d/blup-studio_${v}_linux_amd64.tar.gz -C /tmp && if ldd /tmp/blup-studio | grep 'not found'; then exit 1; fi"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-linux
          path: dist-studio/*
          if-no-files-found: error

  # Blup Studio for the Microsoft Store: an unsigned .msix per architecture
  # (the Store signs it), kept as this run's artifact. Nothing goes to the
  # Store or to the release. The product identity comes from repository
  # variables (Partner Center > Product identity); without them this job
  # only says so.
  studio-msix:
    needs: release
    runs-on: windows-latest
    env:
      # DSN do projeto "Blup Studio (desktop)" no Pulse; vai para
      # -X main.studioSentryDSN. Sem ela, o Studio não manda relatórios.
      SENTRY_DSN: ${{ vars.STUDIO_SENTRY_DSN }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - if: env.MSIX_PUBLISHER == ''
        run: |
          echo "::notice::MSIX skipped: set MSIX_IDENTITY_NAME, MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME in the repository variables."
      - if: env.MSIX_PUBLISHER != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.MSIX_PUBLISHER != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: studio/go.mod
      - if: env.MSIX_PUBLISHER != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: env.MSIX_PUBLISHER != ''
        name: .msix for x64 and arm64
        shell: bash
        run: |
          v="${TAG#v}"
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          (cd studio/frontend && npm ci)
          mkdir -p dist-msix
          for arch in x64 arm64; do
            goarch=$([ "$arch" = x64 ] && echo amd64 || echo arm64)
            go run ./scripts/msix-manifest -version "$v" -arch "$arch" -out "$RUNNER_TEMP/AppxManifest-$arch.xml"
            (cd studio && wails3 task windows:create:msix:package ARCH="$goarch" VERSION="$v" CHANNEL=msstore MANIFEST="$RUNNER_TEMP/AppxManifest-$arch.xml")
            mv "studio/bin/blup-studio-$goarch.msix" "dist-msix/blup-studio_${v}_${arch}.msix"
          done
      - if: env.MSIX_PUBLISHER != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-msix
          path: dist-msix/*.msix
          if-no-files-found: error

  # The Windows installer and the macOS .dmg, from the same workflow as the
  # test builds (builds.yml). Blup Notes has its own versions and release
  # (notes-release.yml, tags notes-vX.Y.Z).
  apps:
    needs: release
    uses: ./.github/workflows/builds.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      apps: desktop
    secrets: inherit

  # The Linux, Windows and macOS files go up to the release with their
  # sha256 and the owner's Ed25519 signature over the list, as checksums.txt
  # does for the CLI.
  studio-publish:
    needs: [studio-linux, apps]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{studio-linux,studio-windows,studio-macos}"
          merge-multiple: true
          path: dist-studio
      - name: Checksums, signature and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLUP_RELEASE_KEY: ${{ secrets.BLUP_RELEASE_KEY }}
        run: |
          (cd dist-studio && sha256sum -- * > studio-checksums.txt)
          go run ./scripts/sign-release -in dist-studio/studio-checksums.txt -out dist-studio/studio-checksums.txt.sig
          gh release upload "$TAG" dist-studio/* --clobber
