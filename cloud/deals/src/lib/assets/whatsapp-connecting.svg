<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" class="wc-art" fill="none" stroke="#0e1b45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><style>.wc-art .wc-breathe{transform-origin:160px 150px;animation:wc-breathe 3.2s ease-in-out infinite}
.wc-art .wc-blink{animation:wc-blink 4.8s infinite}
.wc-art .wc-packet{animation:wc-transfer 2.8s ease-in-out infinite}
.wc-art .wc-packet-1{transform:translate(-12px,-13px)}
.wc-art .wc-packet-2{transform:translate(-28px,-18px);animation-delay:-.93s}
.wc-art .wc-packet-3{transform:translate(-44px,-10px);animation-delay:-1.86s}
.wc-art .wc-row{animation:wc-scan 2.8s ease-in-out infinite}
.wc-art .wc-row-2{animation-delay:.25s}
.wc-art .wc-row-3{animation-delay:.5s}
@keyframes wc-breathe{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(-.4deg)}}
@keyframes wc-blink{0%,44%,49%,100%{transform:scaleY(1)}46%{transform:scaleY(.1)}}
@keyframes wc-transfer{0%{opacity:0;transform:translate(0,0) scale(.65)}12%{opacity:1}30%{transform:translate(-14px,-14px) scale(1)}55%{transform:translate(-34px,-17px) scale(1)}80%{opacity:1;transform:translate(-50px,0) scale(.9)}100%{opacity:0;transform:translate(-54px,7px) scale(.65)}}
@keyframes wc-scan{0%,70%,100%{opacity:.55}35%{opacity:1}}
