<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="/blup.svg" />
		<title>Blup Cloud</title>
		<meta name="description" content="Blup Cloud: your Blup account, plan, notes sync and published sites." />
		<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
		<script src="/theme.js"></script>
		<script src="/cdn-cgi/zaraz/i.js" referrerpolicy="origin"></script>
		<style>
			/* The loading screen: the app's icon from the first paint until the
			   panel draws its first page. Here, not in app.css, because the
			   panel's CSS only arrives with its JavaScript. Shows only after a
			   moment, so a quick load does not flash it. */
			html { background: #fafafa; }
			html[data-theme="dark"] { background: #0a0a0a; }
			.boot { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
			.boot img { opacity: 0; animation: boot-in 0.3s ease 0.3s forwards, boot-breathe 1.6s ease-in-out 0.6s infinite; }
			body:has(#app > :not(script)) .boot { display: none; }
			@keyframes boot-in { to { opacity: 1; } }
			@keyframes boot-breathe { 50% { transform: scale(0.92); } }
			@media (prefers-reduced-motion: reduce) { .boot img { animation: boot-in 0.3s ease 0.3s forwards; } }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="boot" aria-hidden="true"><img src="/blup.svg" alt="" width="48" height="48" /></div>
		<div id="app" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
